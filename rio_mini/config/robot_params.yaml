# Robot Movement Parameters and Safety Limits

ollama_node:
  ros__parameters:
    # Movement Safety Limits (Differential Drive)
    robot_movement:
      movement:
        max_duration: 1.0 # seconds
        max_linear_speed: 0.25 # m/s (forward/backward only)
        min_linear_speed: 0.2 # m/s minimum forward/backward speed
        max_angular_speed: 2.0 # rad/s (rotation only)
        min_angular_speed: 0.5 # rad/s minimum rotation speed
        inplace_rotation_speed: 9.5 # rad/s for pure in-place rotation (linear_x=0)
        default_duration: 0.5 # seconds for quick reactions
        # Differential drive: only linear_x and angular_z are used
        # linear_y is ignored for differential drive robots

      # Head Movement Parameters
      head:
        top_position: 150 # degrees (head up)
        bottom_position: 180 # degrees (head down)
        front_position: 165 # degrees (neutral/front looking)
        gesture_duration: 0.8 # seconds for natural gestures
        gesture_speed: 0.5 # speed multiplier for gestures

      # Movement Tool Parameters
      move_with_duration:
        min_duration: 0.1 # seconds minimum movement
        max_duration: 2.0 # seconds maximum movement
        default_duration: 0.5 # seconds default movement
        safety_stop_duration: 0.1 # seconds to stop after movement
