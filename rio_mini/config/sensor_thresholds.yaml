# Sensor Thresholds and Environment Monitoring Configuration

environment_node:
  ros__parameters:
    # IMU (Motion) Thresholds - Y-axis acceleration only
    imu:
      tilt_threshold: 7.0 # m/s² for tilt detection (absolute value, no sign needed)
      axis: "y" # Use Y-axis linear acceleration

    # TOF (Distance) Sensor - Edge detection only
    tof:
      edge_threshold: 0.10 # meters (10cm) - triggers when distance > threshold

    # Illuminance Sensor - Bright and Dark only
    illuminance:
      bright_threshold: 2000.0 # lux - triggers when illuminance > threshold
      dark_threshold: 0.3 # lux - triggers when illuminance < threshold

    # Sensor Topic Names
    sensor_topics:
      imu_topic: "/imu/data"
      tof_topic: "/tof"
      illuminance_topic: "/illuminance"

    # Sensor Message Types
    sensor_types:
      imu_type: "sensor_msgs/Imu"
      tof_type: "sensor_msgs/Range"
      illuminance_type: "sensor_msgs/Illuminance"

    # Reaction Settings
    reaction:
      cooldown_period: 20.0 # seconds between reactions
      enable_imu_reactions: true
      enable_tof_reactions: true
      enable_illuminance_reactions: true

    # Monitoring Frequency
    monitoring:
      update_rate: 10.0 # Hz
      threshold_check_rate: 5.0 # Hz

